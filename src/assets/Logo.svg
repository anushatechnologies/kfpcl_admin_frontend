<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF" />

  <!-- Top Graphic Area -->
  <g transform="translate(4, 8)">
    <!-- Globe Orbital Ring -->
    <path d="M140 200 C 135 110, 210 45, 310 45 C 385 45, 435 95, 445 170 C 448 190, 440 195, 430 180 C 415 115, 365 72, 305 72 C 225 72, 165 125, 168 200 Z" fill="url(#ringGrad)" />

    <!-- Outer Globe Ring -->
    <circle cx="280" cy="180" r="118" fill="none" stroke="url(#ringGrad)" stroke-width="14" opacity="0.9" />

    <!-- Globe Sphere Base -->
    <circle cx="280" cy="180" r="110" fill="#f0f9ff" />

    <!-- Continents (Asia / Africa / Europe / India) -->
    <g fill="url(#globeGrad)">
      <!-- Eurasia & India outline -->
      <path d="M230 115 C245 105, 270 100, 290 105 C310 110, 335 115, 350 135 C365 155, 370 180, 355 200 C345 210, 335 220, 320 225 C315 228, 305 235, 300 248 C295 240, 290 220, 292 205 C295 190, 280 185, 270 180 C260 175, 250 178, 245 170 C240 160, 235 150, 225 145 C220 135, 222 122, 230 115 Z" />
      <!-- India Subcontinent & Southeast Asia -->
      <path d="M272 170 Q280 190 286 210 Q280 200 274 185 Z" />
      <path d="M310 195 C320 190, 340 195, 350 215 C340 225, 325 220, 310 195 Z" />
      <!-- Japan / East archipelago -->
      <path d="M355 140 C360 145, 362 160, 358 170 C354 165, 352 150, 355 140 Z" />
      <!-- Africa / Middle East portion -->
      <path d="M205 160 C215 150, 230 155, 235 165 C230 185, 220 195, 210 205 C200 195, 198 175, 205 160 Z" />
      <path d="M235 135 C242 130, 250 135, 248 145 C242 150, 236 142, 235 135 Z" />
    </g>

    <!-- Cargo Shipping Container -->
    <g transform="translate(108, 205)" filter="url(#shadow)">
      <!-- Container 3D Body -->
      <!-- Front perspective panel -->
      <path d="M0 20 L55 0 L55 90 L0 80 Z" fill="#1e40af" />
      <!-- Main side panel -->
      <path d="M55 0 L125 18 L125 106 L55 90 Z" fill="url(#containerGrad)" />
      
      <!-- Corrugated Ribs on Main Face -->
      <path d="M68 5 L68 93 M80 8 L80 96 M92 11 L92 99 M104 14 L104 102 M116 16 L116 104" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
      
      <!-- Front Door Frame & Bars -->
      <rect x="6" y="24" width="20" height="50" fill="none" stroke="#93c5fd" stroke-width="2" />
      <rect x="28" y="20" width="20" height="55" fill="none" stroke="#93c5fd" stroke-width="2" />
      <line x1="16" y1="24" x2="16" y2="74" stroke="#ffffff" stroke-width="2.5" />
      <line x1="38" y1="20" x2="38" y2="75" stroke="#ffffff" stroke-width="2.5" />
      
      <!-- Container outline -->
      <path d="M0 20 L55 0 L125 18 L125 106 L55 90 L0 80 Z" fill="none" stroke="#172554" stroke-width="3" />
    </g>

    <!-- Dynamic Green Swoosh Arrow -->
    <path d="M190 300 C 235 322, 330 318, 385 240 C 405 210, 420 170, 435 130 L455 178 L440 120 L382 135 L418 152 C 402 195, 385 225, 362 250 C 315 300, 235 306, 190 286 Z" fill="url(#arrowGrad)" />

    <!-- Green Eco Leaves -->
    <!-- Left Leaf -->
    <path d="M210 295 C190 260, 205 225, 245 225 C255 255, 240 290, 210 295 Z" fill="url(#leafGrad1)" stroke="#ffffff" stroke-width="3" />
    <path d="M215 290 Q228 260 245 230" stroke="#bbf7d0" stroke-width="2" fill="none" />

    <!-- Right Leaf -->
    <path d="M240 300 C240 265, 265 235, 305 240 C310 275, 280 305, 240 300 Z" fill="url(#leafGrad2)" stroke="#ffffff" stroke-width="3" />
    <path d="M245 295 Q270 270 300 245" stroke="#bbf7d0" stroke-width="2" fill="none" />
  </g>

  <!-- Typography -->
  <!-- KFPCL -->
  <text x="256" y="380" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="68" font-weight="900" fill="#0f2b5c" text-anchor="middle" letter-spacing="4">KFPCL</text>

  <!-- EXPORTS -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="52" font-weight="800" fill="#15803d" text-anchor="middle" letter-spacing="3">EXPORTS</text>

  <!-- Subtitle -->
  <text x="256" y="474" font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-size="14.5" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="2.2">GLOBAL TRADE. TRUSTED CONNECTIONS.</text>
</svg>